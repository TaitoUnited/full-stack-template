timeout: 3000s

# If you want to grant outsiders access to your build logs, you may save
# the logs to a separate bucket determined by the logsBucket setting and
# grant the outsiders access to the bucket
# logsBucket: 'gs://my-builds' # TODO _TEMPLATE_DEFAULT for this also

options:
  logging: CLOUD_LOGGING_ONLY
  # Artifact builds run concurrently; keep enough CPU available for all four.
  machineType: E2_HIGHCPU_8

substitutions:
  _REPO_NAME: full-stack-template
  # Set by pull-request triggers. Empty for branch pushes.
  _PR_NUMBER: ""
  _IMAGE_REGISTRY: eu.gcr.io/$PROJECT_ID
  _TAITO_CI_PHASES:
  _VC_TOKEN:

steps:
  # NOTE: This first step is an optimization. We execute CI/CD build cancel with
  # the google provided gcloud container instead of Taito CLI, because it
  # doesn't need to be pulled before execution -> cancel executes immediately.
  - id: manual-cancel
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    env:
      - build_id=$BUILD_ID
      - build_location=$LOCATION
      - repo_name=$_REPO_NAME
      - branch_name=$BRANCH_NAME
      - pr_number=${_PR_NUMBER}
    args:
      - "-c"
      - |
        if [[ -n "$${pr_number}" ]]; then
          export taito_target_env="pr-$${pr_number}"
        else
          export taito_target_env="$${branch_name//master/prod}"
        fi
        source ./taito-config.sh
        echo "- Cancel all previous ongoing builds targetting the same branch"
        gcloud builds list \
          --format="table[no-heading](id)" \
          --ongoing \
          --region "$${build_location}" \
          --filter=" \
            substitutions._REPO_NAME='$${repo_name}' AND \
            substitutions._PR_NUMBER='$${pr_number}' AND \
            substitutions.BRANCH_NAME='$${branch_name}'" | \
          grep -v "$${build_id}" | \
          xargs gcloud builds cancel --region "$${build_location}" 2> /dev/null || :

  # ----------------------- Taito CLI ----------------------------------

  # Prepare build

  - id: build-prepare
    waitFor: ["-"]
    name: "${_TEMPLATE_DEFAULT_TAITO_IMAGE}"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ -n "${_PR_NUMBER}" ]]; then DEPLOY_ENV="pr-${_PR_NUMBER}"; else DEPLOY_ENV="$BRANCH_NAME"; fi
        taito build-prepare:$$DEPLOY_ENV "$COMMIT_SHA"
    env:
      - taito_mode=ci
      - taito_ci_phases=${_TAITO_CI_PHASES}
      - VC_TOKEN=${_VC_TOKEN}

  # Build artifacts in parallel

  - id: artifact-prepare-client
    waitFor: ["build-prepare"]
    name: "${_TEMPLATE_DEFAULT_TAITO_IMAGE}"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ -n "${_PR_NUMBER}" ]]; then DEPLOY_ENV="pr-${_PR_NUMBER}"; else DEPLOY_ENV="$BRANCH_NAME"; fi
        taito artifact-prepare:client:$$DEPLOY_ENV "$COMMIT_SHA"
    env:
      - taito_mode=ci
      - taito_ci_phases=${_TAITO_CI_PHASES}

  - id: artifact-prepare-playwright
    waitFor: ["build-prepare"]
    name: "${_TEMPLATE_DEFAULT_TAITO_IMAGE}"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ -n "${_PR_NUMBER}" ]]; then DEPLOY_ENV="pr-${_PR_NUMBER}"; else DEPLOY_ENV="$BRANCH_NAME"; fi
        taito artifact-prepare:playwright:$$DEPLOY_ENV "$COMMIT_SHA"
    env:
      - taito_mode=ci
      - taito_ci_phases=${_TAITO_CI_PHASES}

  - id: artifact-prepare-server
    waitFor: ["build-prepare"]
    name: "${_TEMPLATE_DEFAULT_TAITO_IMAGE}"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ -n "${_PR_NUMBER}" ]]; then DEPLOY_ENV="pr-${_PR_NUMBER}"; else DEPLOY_ENV="$BRANCH_NAME"; fi
        taito artifact-prepare:server:$$DEPLOY_ENV "$COMMIT_SHA"
    env:
      - taito_mode=ci
      - taito_ci_phases=${_TAITO_CI_PHASES}
      - taito_ci_pull_always=true # Server image is always needed for deploying db migrations

  - id: artifact-prepare-worker
    waitFor: ["build-prepare"]
    name: "${_TEMPLATE_DEFAULT_TAITO_IMAGE}"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ -n "${_PR_NUMBER}" ]]; then DEPLOY_ENV="pr-${_PR_NUMBER}"; else DEPLOY_ENV="$BRANCH_NAME"; fi
        taito artifact-prepare:worker:$$DEPLOY_ENV "$COMMIT_SHA"
    env:
      - taito_mode=ci
      - taito_ci_phases=${_TAITO_CI_PHASES}

  # Deploy to target environment

  # A PR gets an isolated database before its migrations are applied. Branch
  # environments retain their existing database and skip this step.
  - id: db-recreate
    waitFor: ["build-prepare"]
    name: "${_TEMPLATE_DEFAULT_TAITO_IMAGE}"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ -n "${_PR_NUMBER}" ]]; then
          taito db-recreate:pr-${_PR_NUMBER}
        else
          echo "No PR database to recreate for $BRANCH_NAME"
        fi
    env:
      - taito_mode=ci
      - taito_ci_phases=${_TAITO_CI_PHASES}

  - id: db-deploy
    waitFor: ["artifact-prepare-server", "db-recreate"]
    name: "${_TEMPLATE_DEFAULT_TAITO_IMAGE}"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ -n "${_PR_NUMBER}" ]]; then DEPLOY_ENV="pr-${_PR_NUMBER}"; else DEPLOY_ENV="$BRANCH_NAME"; fi
        taito db-deploy:$$DEPLOY_ENV
    env:
      - taito_mode=ci
      - taito_ci_phases=${_TAITO_CI_PHASES}
      - taito_image=${_TEMPLATE_DEFAULT_TAITO_IMAGE}
      - IMAGE_TAG=$COMMIT_SHA

  - id: deployment-deploy
    waitFor: ["artifact-prepare-client", "artifact-prepare-server", "artifact-prepare-worker", "db-deploy"]
    name: "${_TEMPLATE_DEFAULT_TAITO_IMAGE}"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ -n "${_PR_NUMBER}" ]]; then DEPLOY_ENV="pr-${_PR_NUMBER}"; else DEPLOY_ENV="$BRANCH_NAME"; fi
        taito deployment-deploy:$$DEPLOY_ENV "$COMMIT_SHA"
    env:
      - taito_mode=ci
      - taito_ci_phases=${_TAITO_CI_PHASES}

  # Test and verify deployment

  - id: deployment-wait
    waitFor: ["deployment-deploy"]
    name: "${_TEMPLATE_DEFAULT_TAITO_IMAGE}"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ -n "${_PR_NUMBER}" ]]; then DEPLOY_ENV="pr-${_PR_NUMBER}"; else DEPLOY_ENV="$BRANCH_NAME"; fi
        taito deployment-wait:$$DEPLOY_ENV
    env:
      - taito_mode=ci
      - taito_ci_phases=${_TAITO_CI_PHASES}

  - id: test
    # Playwright is a test dependency, not a deployment dependency. Waiting
    # here lets its image build overlap the application deployment.
    waitFor: ["artifact-prepare-playwright", "deployment-wait"]
    name: "${_TEMPLATE_DEFAULT_TAITO_IMAGE}"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ -n "${_PR_NUMBER}" ]]; then DEPLOY_ENV="pr-${_PR_NUMBER}"; else DEPLOY_ENV="$BRANCH_NAME"; fi
        taito test:$$DEPLOY_ENV
    env:
      - taito_mode=ci
      - taito_ci_phases=${_TAITO_CI_PHASES}
      - taito_image=${_TEMPLATE_DEFAULT_TAITO_IMAGE}
      - IMAGE_TAG=$COMMIT_SHA

  - id: deployment-verify
    waitFor: ["test"]
    name: "${_TEMPLATE_DEFAULT_TAITO_IMAGE}"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ -n "${_PR_NUMBER}" ]]; then DEPLOY_ENV="pr-${_PR_NUMBER}"; else DEPLOY_ENV="$BRANCH_NAME"; fi
        taito deployment-verify:$$DEPLOY_ENV
    env:
      - taito_mode=ci
      - taito_ci_phases=${_TAITO_CI_PHASES}

  # Release artifacts in parallel

  - id: artifact-release-client
    waitFor: ["deployment-verify"]
    name: "${_TEMPLATE_DEFAULT_TAITO_IMAGE}"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ -n "${_PR_NUMBER}" ]]; then DEPLOY_ENV="pr-${_PR_NUMBER}"; else DEPLOY_ENV="$BRANCH_NAME"; fi
        taito artifact-release:client:$$DEPLOY_ENV "$COMMIT_SHA"
    env:
      - taito_mode=ci
      - taito_ci_phases=${_TAITO_CI_PHASES}

  - id: artifact-release-playwright
    waitFor: ["deployment-verify"]
    name: "${_TEMPLATE_DEFAULT_TAITO_IMAGE}"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ -n "${_PR_NUMBER}" ]]; then DEPLOY_ENV="pr-${_PR_NUMBER}"; else DEPLOY_ENV="$BRANCH_NAME"; fi
        taito artifact-release:playwright:$$DEPLOY_ENV "$COMMIT_SHA"
    env:
      - taito_mode=ci
      - taito_ci_phases=${_TAITO_CI_PHASES}

  - id: artifact-release-server
    waitFor: ["deployment-verify"]
    name: "${_TEMPLATE_DEFAULT_TAITO_IMAGE}"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ -n "${_PR_NUMBER}" ]]; then DEPLOY_ENV="pr-${_PR_NUMBER}"; else DEPLOY_ENV="$BRANCH_NAME"; fi
        taito artifact-release:server:$$DEPLOY_ENV "$COMMIT_SHA"
    env:
      - taito_mode=ci
      - taito_ci_phases=${_TAITO_CI_PHASES}

  - id: artifact-release-worker
    waitFor: ["deployment-verify"]
    name: "${_TEMPLATE_DEFAULT_TAITO_IMAGE}"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ -n "${_PR_NUMBER}" ]]; then DEPLOY_ENV="pr-${_PR_NUMBER}"; else DEPLOY_ENV="$BRANCH_NAME"; fi
        taito artifact-release:worker:$$DEPLOY_ENV "$COMMIT_SHA"
    env:
      - taito_mode=ci
      - taito_ci_phases=${_TAITO_CI_PHASES}

  # Release build

  - id: build-release
    waitFor: ["artifact-release-client", "artifact-release-playwright", "artifact-release-server", "artifact-release-worker"]
    name: "${_TEMPLATE_DEFAULT_TAITO_IMAGE}"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ -n "${_PR_NUMBER}" ]]; then DEPLOY_ENV="pr-${_PR_NUMBER}"; else DEPLOY_ENV="$BRANCH_NAME"; fi
        taito build-release:$$DEPLOY_ENV
    env:
      - taito_mode=ci
      - taito_ci_phases=${_TAITO_CI_PHASES}
      - VC_TOKEN=${_VC_TOKEN}
